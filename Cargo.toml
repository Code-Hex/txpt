[package]
name = "txpt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.100"
blake3 = "1.8.2"
filetime = "0.2.26"
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
similar = "3.1.0"
tempfile = "3.23.0"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
